<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>되는 날 - 약속 달력</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
      background-color: #F4F2EC;
      color: #2B448C;
      touch-action: manipulation;
    }
    .retro-border { border-color: rgba(43, 68, 140, 0.25); }
  </style>
</head>
<body class="p-3 sm:p-6 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md bg-[#FAF9F5] p-4 sm:p-5 rounded-sm shadow-md border retro-border">
    
    <div class="flex justify-between items-center text-xs pb-2 border-b retro-border font-bold">
      <span class="tracking-wider text-[#C83E34]">〈 되는 날 〉</span>
      <div id="userBadge" class="cursor-pointer text-[#2B448C] underline" onclick="openNameModal()">이름 등록하기</div>
    </div>

    <div class="flex items-center justify-between py-4">
      <button id="prevBtn" onclick="changeMonth(-1)" class="text-2xl font-black px-3 text-[#2B448C] disabled:opacity-20 cursor-pointer">‹</button>
      <div class="text-center">
        <span id="yearDisplay" class="text-xs font-bold tracking-widest text-[#2B448C]/70 block">2026</span>
        <span id="monthDisplay" class="text-4xl font-black text-[#C83E34] tracking-tight">10</span>
      </div>
      <button id="nextBtn" onclick="changeMonth(1)" class="text-2xl font-black px-3 text-[#2B448C] disabled:opacity-20 cursor-pointer">›</button>
    </div>

    <div class="grid grid-cols-7 border-y retro-border text-center font-bold text-xs py-1.5">
      <span class="text-[#C83E34]">S</span>
      <span class="text-[#2B448C]">M</span>
      <span class="text-[#2B448C]">T</span>
      <span class="text-[#2B448C]">F</span>
      <span class="text-[#2B448C]">T</span>
      <span class="text-[#2B448C]">F</span>
      <span class="text-[#2B448C]">S</span>
    </div>

    <div id="calendarGrid" class="grid grid-cols-7 border-l border-t retro-border bg-white/40"></div>

    <div class="mt-4 pt-3 border-t retro-border flex justify-between items-center text-[11px] text-[#2B448C]/80 font-medium">
      <div class="flex items-center gap-1.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#E06D6D]"></span> 안됨
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#E5A84B] ml-1"></span> 애매
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#5BAE85] ml-1"></span> 선호
      </div>
      <span class="text-[10px] text-stone-400">칸 터치: 상태변경 | 💬 터치: 메모</span>
    </div>
  </div>

  <div id="nameModal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-[#FAF9F5] p-5 border retro-border w-full max-w-xs shadow-lg">
      <h3 class="font-bold text-sm mb-1 text-[#2B448C]">사용할 닉네임 입력</h3>
      <p class="text-[11px] text-stone-500 mb-3">단톡방 친구들이 알아볼 수 있는 이름을 적어주세요.</p>
      <input type="text" id="nameInput" placeholder="예: 지혜은" class="w-full border retro-border p-2 text-sm bg-white outline-none mb-3 font-medium">
      <button onclick="saveName()" class="w-full bg-[#2B448C] text-white py-2 text-xs font-bold hover:bg-[#1f3266]">확인</button>
    </div>
  </div>

  <div id="detailModal" class="fixed inset-0 bg-black/40 flex items-end justify-center z-50 hidden" onclick="closeDetailModal(event)">
    <div class="bg-[#FAF9F5] w-full max-w-md p-5 border-t-2 border-[#2B448C] rounded-t-lg shadow-xl" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalDateTitle" class="text-base font-black text-[#C83E34]">2026.10.22</h3>
        <button onclick="closeDetailModal()" class="text-lg font-bold text-[#2B448C] px-2">✕</button>
      </div>

      <div class="bg-white/80 p-2.5 border retro-border text-xs mb-3 space-y-1">
        <div><strong class="text-[#E06D6D]">안 됨(❌):</strong> <span id="listX" class="text-stone-600">-</span></div>
        <div><strong class="text-[#E5A84B]">애 매(🔺):</strong> <span id="listTriangle" class="text-stone-600">-</span></div>
        <div><strong class="text-[#5BAE85]">선 호(⭕):</strong> <span id="listO" class="text-stone-600">-</span></div>
      </div>

      <div class="border retro-border bg-white/50 p-2.5 h-36 overflow-y-auto text-xs mb-2 space-y-1.5" id="notesList"></div>

      <div class="flex gap-1.5">
        <input type="text" id="noteInput" placeholder="한 줄 메모 남기기" class="flex-1 border retro-border p-2 text-xs bg-white outline-none">
        <button onclick="submitNote()" class="bg-[#2B448C] text-white px-3 text-xs font-bold">등록</button>
      </div>
    </div>
  </div>

  <script>
    // 상태값
    var currentYear = 2026;
    var currentMonth = 10;
    var currentUser = '';
    var selectedDate = null;
    var responsesData = [];
    var notesData = [];
    var NEXT_STATUS = { 'NONE': 'X', 'X': 'TRIANGLE', 'TRIANGLE': 'O', 'O': 'NONE' };

    try {
      currentUser = localStorage.getItem('becoming_user') || '';
    } catch(e) {}

    // 1. 달력 및 기본 버튼 렌더링 (가장 먼저 무조건 실행)
    function renderCalendar() {
      var yDisp = document.getElementById('yearDisplay');
      var mDisp = document.getElementById('monthDisplay');
      var pBtn = document.getElementById('prevBtn');
      var nBtn = document.getElementById('nextBtn');
      var grid = document.getElementById('calendarGrid');

      if (!grid || !yDisp || !mDisp) return;

      yDisp.textContent = currentYear;
      mDisp.textContent = currentMonth;

      pBtn.disabled = (currentYear === 2026 && currentMonth === 10);
      nBtn.disabled = (currentYear === 2027 && currentMonth === 12);

      grid.innerHTML = '';

      var firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      var lastDate = new Date(currentYear, currentMonth, 0).getDate();

      // 이전 달 빈칸
      for (var i = 0; i < firstDay; i++) {
        var emptyCell = document.createElement('div');
        emptyCell.className = "h-20 sm:h-24 border-r border-b retro-border bg-[#F5F4EE]/60 select-none";
        grid.appendChild(emptyCell);
      }

      // 날짜 칸 렌더링
      for (var d = 1; d <= lastDate; d++) {
        (function(dayNum) {
          var dateStr = currentYear + '-' + String(currentMonth).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
          var dayOfWeek = (firstDay + dayNum - 1) % 7;
          var cell = document.createElement('div');

          var dateRes = responsesData.filter(function(r) { return r.target_date === dateStr; });
          var myRes = dateRes.find(function(r) { return r.user_name === currentUser; });
          var xCount = dateRes.filter(function(r) { return r.status === 'X'; }).length;
          var oCount = dateRes.filter(function(r) { return r.status === 'O'; }).length;
          var noteCount = notesData.filter(function(n) { return n.target_date === dateStr; }).length;

          // 배경 색상
          var bgClass = "bg-white active:bg-stone-50";
          if (xCount === 1 || xCount === 2) bgClass = "bg-stone-100 active:bg-stone-200";
          else if (xCount >= 3) bgClass = "bg-stone-200 active:bg-stone-300";
          else if (xCount === 0 && oCount > 0) bgClass = "bg-[#F0FDF4] active:bg-[#e1f7e9]";

          cell.className = "h-20 sm:h-24 border-r border-b retro-border p-1 flex flex-col justify-between cursor-pointer transition-all select-none " + bgClass;
          cell.style.webkitUserSelect = "none";
          cell.style.webkitTouchCallout = "none";

          // ★ 롱프레스(꾹 누르기 = 모달) & 단일 탭(상태 변경) 핸들러
          var pressTimer = null;
          var isLongPress = false;

          function startPress(e) {
            isLongPress = false;
            pressTimer = setTimeout(function() {
              isLongPress = true;
              if (navigator.vibrate) navigator.vibrate(40); // 모바일 진동 손맛
              openDetailModal(dateStr);
            }, 450); // 450ms 유지 시 모달 오픈
          }

          function cancelPress() {
            if (pressTimer) {
              clearTimeout(pressTimer);
              pressTimer = null;
            }
          }

          function endPress(e) {
            cancelPress();
            if (!isLongPress) {
              // 꾹 누른 게 아닐 때만 빠른 상태 변경 실행
              handleDateToggle(dateStr, myRes ? myRes.status : 'NONE');
            }
          }

          // 모바일 터치 이벤트
          cell.ontouchstart = startPress;
          cell.ontouchend = endPress;
          cell.ontouchmove = cancelPress;

          // 데스크톱 마우스 이벤트 대응
          cell.onmousedown = startPress;
          cell.onmouseup = endPress;
          cell.onmouseleave = cancelPress;
          cell.oncontextmenu = function(e) { e.preventDefault(); }; // 우클릭 팝업 방지

          // 상단 날짜 숫자 및 메모 인디케이터
          var topRow = document.createElement('div');
          topRow.className = "flex justify-between items-start pointer-events-none";

          var dateNum = document.createElement('span');
          dateNum.className = "text-xs sm:text-sm font-bold " + (dayOfWeek === 0 ? "text-[#C83E34]" : "text-[#2B448C]") + (xCount >= 3 ? " opacity-30" : "");
          dateNum.textContent = dayNum;
          topRow.appendChild(dateNum);

          if (noteCount > 0) {
            var noteBadge = document.createElement('span');
            noteBadge.className = "text-[10px] text-stone-400 font-bold";
            noteBadge.innerHTML = '💬<span class="text-[#C83E34]">' + noteCount + '</span>';
            topRow.appendChild(noteBadge);
          }
          cell.appendChild(topRow);

          // 5x5 마이크로 도트 영역
          var microGrid = document.createElement('div');
          microGrid.className = "grid grid-cols-5 gap-0.5 w-full mt-auto pointer-events-none";
          dateRes.slice(0, 25).forEach(function(r) {
            var dot = document.createElement('span');
            dot.className = "w-1.5 h-1.5 rounded-full mx-auto";
            if (r.status === 'X') dot.className += " bg-[#E06D6D]";
            else if (r.status === 'TRIANGLE') dot.className += " bg-[#E5A84B]";
            else if (r.status === 'O') dot.className += " bg-[#5BAE85]";
            microGrid.appendChild(dot);
          });
          cell.appendChild(microGrid);

          grid.appendChild(cell);
        })(d);
      }
    }

    function updateUserBadge() {
      var badge = document.getElementById('userBadge');
      if (badge) {
        badge.textContent = currentUser ? currentUser + ' 님 (변경)' : '이름 등록하기';
      }
    }

    function openNameModal() {
      document.getElementById('nameModal').classList.remove('hidden');
    }

    function saveName() {
      var val = document.getElementById('nameInput').value.trim();
      if (!val) return;
      currentUser = val;
      try { localStorage.setItem('becoming_user', val); } catch(e) {}
      document.getElementById('nameModal').classList.add('hidden');
      updateUserBadge();
      renderCalendar();
    }

    function changeMonth(delta) {
      var y = currentYear;
      var m = currentMonth + delta;
      if (m > 12) { y++; m = 1; }
      if (m < 1) { y--; m = 12; }

      if (y < 2026 || (y === 2026 && m < 10) || y > 2027) return;

      currentYear = y;
      currentMonth = m;
      renderCalendar();
    }

    function openDetailModal(dateStr) {
      selectedDate = dateStr;
      document.getElementById('modalDateTitle').textContent = dateStr;

      var dateRes = responsesData.filter(function(r) { return r.target_date === dateStr; });
      document.getElementById('listX').textContent = dateRes.filter(function(r) { return r.status === 'X'; }).map(function(r) { return r.user_name; }).join(', ') || '없음';
      document.getElementById('listTriangle').textContent = dateRes.filter(function(r) { return r.status === 'TRIANGLE'; }).map(function(r) { return r.user_name; }).join(', ') || '없음';
      document.getElementById('listO').textContent = dateRes.filter(function(r) { return r.status === 'O'; }).map(function(r) { return r.user_name; }).join(', ') || '없음';

      renderNotes();
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function renderNotes() {
      var list = document.getElementById('notesList');
      list.innerHTML = '';
      var notes = notesData.filter(function(n) { return n.target_date === selectedDate; });
      if (notes.length === 0) {
        list.innerHTML = '<p class="text-stone-400 text-center py-4 text-[11px]">등록된 메모가 없습니다.</p>';
        return;
      }
      notes.forEach(function(n) {
        var item = document.createElement('div');
        item.className = "bg-white p-1.5 border retro-border rounded-sm";
        var time = new Date(n.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        item.innerHTML = '<span class="font-bold text-[#2B448C]">' + n.user_name + '</span> <span class="text-[9px] text-stone-400">(' + time + ')</span>: <span>' + n.content + '</span>';
        list.appendChild(item);
      });
    }

    // 2. Supabase 비동기 통신 (화면 렌더링 이후 안전하게 동작)
    var SUPABASE_URL = "https://anavirxptzwfshmfzjsz.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_oh812tgsuquxB7xWACh_tQ_reslnov1";
    var supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(err) {
      console.warn("Supabase 연결 스킵:", err);
    }

    async function fetchData() {
      if (!supabaseClient) return;
      try {
        var res = await supabaseClient.from('responses').select('*');
        var notes = await supabaseClient.from('date_notes').select('*');
        if (res.data) responsesData = res.data;
        if (notes.data) notesData = notes.data;
        renderCalendar();
      } catch(e) {}
    }

    async function handleDateToggle(dateStr, currentStatus) {
      if (!currentUser) { openNameModal(); return; }
      var next = NEXT_STATUS[currentStatus];

      if (supabaseClient) {
        try {
          if (next === 'NONE') {
            await supabaseClient.from('responses').delete().match({ user_name: currentUser, target_date: dateStr });
          } else {
            await supabaseClient.from('responses').upsert({
              user_name: currentUser,
              target_date: dateStr,
              status: next,
              updated_at: new Date().toISOString()
            }, { onConflict: 'user_name, target_date' });
          }
          fetchData();
          return;
        } catch(e) {}
      }

      // 로컬 즉시 반영
      responsesData = responsesData.filter(function(r) { return !(r.user_name === currentUser && r.target_date === dateStr); });
      if (next !== 'NONE') responsesData.push({ user_name: currentUser, target_date: dateStr, status: next });
      renderCalendar();
    }

    async function submitNote() {
      var input = document.getElementById('noteInput');
      var content = input.value.trim();
      if (!content || !selectedDate || !currentUser) return;

      if (supabaseClient) {
        try {
          await supabaseClient.from('date_notes').insert({
            target_date: selectedDate,
            user_name: currentUser,
            content: content
          });
          input.value = '';
          fetchData();
          renderNotes();
          return;
        } catch(e) {}
      }

      notesData.push({ target_date: selectedDate, user_name: currentUser, content: content, created_at: new Date().toISOString() });
      input.value = '';
      renderNotes();
      renderCalendar();
    }

    // 초기 화면 즉시 기동
    updateUserBadge();
    renderCalendar();
    if (!currentUser) openNameModal();
    fetchData();
  </script>
</body>
</html>
